<h2>Projects</h2>

@for (p of projects(); track p._id) {

  <article>

    @if (p.image) {
      <img
        [src]="p.image"
        [alt]="p.title"
        width="300"
      >
    }

    <h3>{{ p.title }}</h3>

    <p>{{ p.description }}</p>

    @if (p.link) {
      <a [href]="p.link" target="_blank">
        Live demo
      </a>
    }

  </article>

}
